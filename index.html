<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese SRT → Khmer SRT</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Chinese SRT → Khmer SRT</h1>

  <div class="description">
    បកប្រែ Chinese SRT ទៅជាភាសាខ្មែរ
  </div>

  <input type="file" id="srtFile" accept=".srt">

  <textarea id="srtInput" placeholder="ឬ Paste SRT នៅទីនេះ..."></textarea>

  <button id="translateBtn">
    ចាប់ផ្តើមបកប្រែ
  </button>

  <div id="status"></div>

  <textarea id="srtOutput"
    placeholder="លទ្ធផល Khmer SRT នឹងបង្ហាញនៅទីនេះ..."
    readonly></textarea>

  <button id="downloadBtn" style="display:none;">
    ទាញយក Khmer SRT
  </button>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw1X9L2yGiDw95RmRD1mMMT1W9kNzpwdPu94yoWE6CdZhdnE7wOXvm7gWTtcNWH-zzV/exec";

const fileInput = document.getElementById("srtFile");
const input = document.getElementById("srtInput");
const output = document.getElementById("srtOutput");
const translateBtn = document.getElementById("translateBtn");
const downloadBtn = document.getElementById("downloadBtn");
const status = document.getElementById("status");

fileInput.addEventListener("change", function() {

  const file = fileInput.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    input.value = e.target.result;
  };

  reader.readAsText(file, "UTF-8");
});


translateBtn.addEventListener("click", async function() {

  const text = input.value.trim();

  if (!text) {
    status.textContent = "សូម Upload ឬ Paste SRT ជាមុនសិន។";
    return;
  }

  translateBtn.disabled = true;
  status.textContent = "កំពុងបកប្រែ... សូមរង់ចាំ";

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        text: text
      })

    });

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || "Translation failed");
    }

    output.value = data.srt;

    downloadBtn.style.display = "block";

    status.textContent = "បកប្រែរួចរាល់ ✅";

  } catch (error) {

    console.error(error);

    status.textContent =
      "មានបញ្ហា: " + error.message;

  } finally {

    translateBtn.disabled = false;

  }

});


downloadBtn.addEventListener("click", function() {

  const blob = new Blob(
    [output.value],
    {
      type: "text/plain;charset=utf-8"
    }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "khmer-translated.srt";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

});

</script>

</body>
</html>
